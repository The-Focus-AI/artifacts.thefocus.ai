# Source of truth: 1Password vault "Artifacts".
# Each [secrets.X] block maps env var X to a 1Password item in that vault.
# Convention: 1Password item title = env var name (= the `value` field below).

[providers.op]
type = "1password"
vault = "Artifacts"

[secrets.DATABASE_URL]
provider = "op"
value = "DATABASE_URL"
if_missing = "ignore"
description = "Neon Postgres connection string — https://console.neon.tech"

[secrets.BLOB_READ_WRITE_TOKEN]
provider = "op"
value = "BLOB_READ_WRITE_TOKEN"
if_missing = "ignore"
description = "Vercel Blob read/write token — https://vercel.com/dashboard/stores"

[secrets.CLERK_SECRET_KEY]
provider = "op"
value = "CLERK_SECRET_KEY"
if_missing = "ignore"
description = "Clerk backend secret key — https://dashboard.clerk.com"

[secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY]
provider = "op"
value = "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
if_missing = "ignore"
description = "Clerk frontend publishable key — https://dashboard.clerk.com"

[secrets.CLERK_SIGN_IN_DOMAIN]
provider = "op"
value = "CLERK_SIGN_IN_DOMAIN"
if_missing = "ignore"
description = "Clerk sign-in domain from dashboard → Domains (e.g. capital-panther-42.clerk.accounts.dev)"
