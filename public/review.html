<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Review · Living Doc</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1b1b1f;
        --muted: #6b7280;
        --border: #e4e4e7;
        --panel: #f7f7f8;
        --accent: #2563eb;
        --accent-fg: #ffffff;
        --add: #16a34a;
        --remove: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16161a;
          --fg: #ececf1;
          --muted: #9ca3af;
          --border: #2a2a31;
          --panel: #1e1e24;
          --accent: #3b82f6;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.55 system-ui,
          sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--border);
      }
      header h1 {
        font-size: 1rem;
        margin: 0;
      }
      header .status {
        color: var(--muted);
        font-size: 0.8rem;
        margin-left: auto;
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr 22rem;
        height: calc(100vh - 3.25rem);
      }
      @media (max-width: 60rem) {
        .layout {
          grid-template-columns: 1fr;
          height: auto;
        }
      }
      .pane {
        overflow: auto;
        border-right: 1px solid var(--border);
      }
      .pane-head {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--bg);
        padding: 0.5rem 0.9rem;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      #editor {
        max-width: 46rem;
        margin: 0 auto;
        padding: 1.5rem 1.5rem 6rem;
      }
      .front-matter {
        max-width: 46rem;
        margin: 0 auto;
        padding: 1rem 1.5rem 0;
      }
      .front-matter[hidden] {
        display: none;
      }
      .front-matter-panel {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }
      .front-matter-head {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.45rem 0.7rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
      }
      .front-matter-head .spacer {
        flex: 1;
      }
      .front-matter-head button {
        font-size: 0.75rem;
        text-transform: none;
        letter-spacing: 0;
        padding: 0.15rem 0.45rem;
      }
      .front-matter-fields {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        padding: 0.55rem 0.7rem 0.7rem;
      }
      .fm-row {
        display: grid;
        grid-template-columns: minmax(6rem, 9rem) 1fr auto;
        gap: 0.4rem;
        align-items: start;
      }
      .fm-row input,
      .fm-row textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        padding: 0.3rem 0.45rem;
        font: inherit;
        font-size: 0.88rem;
      }
      .fm-row input.key {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.8rem;
      }
      .fm-row textarea {
        min-height: 2.2rem;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.8rem;
        line-height: 1.4;
      }
      .fm-row .fm-remove-field {
        border: none;
        background: transparent;
        color: var(--muted);
        padding: 0.25rem 0.35rem;
      }
      .fm-row .fm-remove-field:hover {
        color: var(--remove);
      }
      .fm-raw {
        width: 100%;
        min-height: 7rem;
        border: none;
        border-top: 1px solid var(--border);
        background: var(--bg);
        color: var(--fg);
        padding: 0.7rem;
        font:
          0.82rem/1.45 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        resize: vertical;
      }
      .fm-error {
        color: var(--remove);
        font-size: 0.75rem;
        padding: 0 0.7rem 0.55rem;
      }
      .fm-error[hidden] {
        display: none;
      }
      .fm-add-wrap {
        padding: 0.55rem 0.9rem 0.9rem;
        max-width: 46rem;
        margin: 0 auto;
      }
      .fm-add-wrap[hidden] {
        display: none;
      }
      .ProseMirror {
        outline: none;
        min-height: 60vh;
        font-size: 16px;
        line-height: 1.6;
      }
      .ProseMirror h1 {
        font-size: 1.7rem;
        line-height: 1.25;
      }
      .ProseMirror h2 {
        font-size: 1.3rem;
      }
      .ProseMirror pre {
        overflow-x: auto;
        background: var(--panel);
        padding: 0.75rem;
        border-radius: 6px;
        font-size: 0.88em;
      }
      .ProseMirror code {
        background: var(--panel);
        border-radius: 4px;
        padding: 0.1em 0.3em;
      }
      .ProseMirror pre code {
        background: none;
        padding: 0;
      }
      .ProseMirror blockquote {
        border-left: 3px solid var(--border);
        margin-left: 0;
        padding-left: 1rem;
        color: var(--muted);
      }
      .ProseMirror img {
        max-width: 100%;
      }
      .sidebar {
        background: var(--panel);
        border-right: none;
      }
      button {
        font: inherit;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--fg);
        border-radius: 6px;
        padding: 0.25rem 0.6rem;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: transparent;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .card {
        border: 1px solid var(--border);
        background: var(--bg);
        border-radius: 8px;
        padding: 0.6rem 0.7rem;
        margin: 0.6rem 0.7rem;
      }
      .card .quote {
        font-size: 0.8rem;
        color: var(--muted);
        border-left: 2px solid var(--border);
        padding-left: 0.5rem;
        margin: 0.35rem 0;
        white-space: pre-wrap;
      }
      .card .replacement {
        font-size: 0.82rem;
        white-space: pre-wrap;
        border-left: 2px solid var(--add);
        padding-left: 0.5rem;
        margin: 0.35rem 0;
      }
      .card .row {
        display: flex;
        gap: 0.4rem;
        margin-top: 0.5rem;
      }
      .card .meta {
        font-size: 0.72rem;
        color: var(--muted);
      }
      .card.agent {
        border-left: 3px solid var(--accent);
      }
      .empty {
        color: var(--muted);
        font-size: 0.85rem;
        padding: 0.9rem 0.8rem;
      }
      .section-title {
        padding: 0.8rem 0.8rem 0.2rem;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
      }
      .suggest-del {
        background: rgba(220, 38, 38, 0.12);
        text-decoration: line-through;
        text-decoration-color: var(--remove);
      }
      .suggest-widget {
        background: rgba(22, 163, 74, 0.12);
        border-radius: 4px;
        padding: 0 0.15rem;
        margin-left: 0.2rem;
        white-space: pre-wrap;
      }
      .suggest-widget .suggest-ins {
        color: var(--add);
      }
      .suggest-widget button {
        border: none;
        background: none;
        padding: 0 0.2rem;
        font-size: 0.85em;
        cursor: pointer;
      }
      .suggest-widget button:hover {
        opacity: 0.7;
      }
      #comment-bubble {
        position: fixed;
        z-index: 20;
        display: none;
      }
      #comment-bubble button {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }
      #comment-popover {
        position: fixed;
        z-index: 21;
        display: none;
        width: 18rem;
        border: 1px solid var(--border);
        background: var(--bg);
        border-radius: 8px;
        padding: 0.6rem;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      }
      #comment-popover textarea {
        width: 100%;
        min-height: 3.5rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        padding: 0.4rem;
        font: inherit;
        resize: vertical;
      }
      #comment-popover .row {
        display: flex;
        gap: 0.4rem;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Living Doc</h1>
      <span class="status" id="status">Loading…</span>
    </header>
    <div class="layout">
      <div class="pane" id="editor-pane">
        <div class="pane-head">Document</div>
        <div class="fm-add-wrap" id="fm-add-wrap" hidden>
          <button type="button" id="fm-add">Add front matter</button>
        </div>
        <div class="front-matter" id="front-matter" hidden>
          <div class="front-matter-panel">
            <div class="front-matter-head">
              <span>Front matter</span>
              <span class="spacer"></span>
              <button type="button" id="fm-mode-toggle">Edit as YAML</button>
              <button type="button" id="fm-clear">Remove</button>
            </div>
            <div class="front-matter-fields" id="fm-fields"></div>
            <textarea
              class="fm-raw"
              id="fm-raw"
              hidden
              spellcheck="false"
              aria-label="Front matter YAML"
            ></textarea>
            <div class="fm-error" id="fm-error" hidden></div>
            <div class="front-matter-fields" id="fm-add-field-row">
              <button type="button" id="fm-add-field">Add field</button>
            </div>
          </div>
        </div>
        <div id="editor"></div>
      </div>
      <div class="pane sidebar">
        <div class="pane-head">Feedback</div>
        <div class="section-title">Agent suggestions</div>
        <div id="suggestions"></div>
        <div class="section-title">Comments</div>
        <div class="empty" id="comment-hint">
          Select text in the document to add a comment.
        </div>
        <div id="comments"></div>
      </div>
    </div>

    <div id="comment-bubble">
      <button class="primary" title="Comment on the selected text">
        💬 Comment
      </button>
    </div>
    <div id="comment-popover">
      <textarea id="popover-input" placeholder="Write a comment…"></textarea>
      <div class="row">
        <button class="primary" id="popover-submit">Comment</button>
        <button id="popover-cancel">Cancel</button>
      </div>
    </div>

    <script type="module">
      import {
        Editor,
        StarterKit,
        Markdown,
        Plugin,
        PluginKey,
        Decoration,
        DecorationSet,
        deriveMarkdownTitle,
        formatFrontMatterFieldValue,
        joinFrontMatter,
        parseFrontMatterData,
        parseFrontMatterFieldValue,
        serializeFrontMatterData,
        splitFrontMatter,
      } from "/vendor/review-editor.js";

      const reviewId = location.pathname.split("/").filter(Boolean)[1] ?? "";
      const statusEl = document.getElementById("status");
      const titleEl = document.getElementById("title");
      const fmRoot = document.getElementById("front-matter");
      const fmFields = document.getElementById("fm-fields");
      const fmRaw = document.getElementById("fm-raw");
      const fmError = document.getElementById("fm-error");
      const fmAddWrap = document.getElementById("fm-add-wrap");
      const fmAddFieldRow = document.getElementById("fm-add-field-row");
      const fmModeToggle = document.getElementById("fm-mode-toggle");

      let saveTimer = null;
      let applyingRemote = false;
      // null = no front matter; otherwise the editable YAML source of truth.
      let frontMatterText = null;
      let frontMatterMode = "fields"; // "fields" | "raw"

      function setStatus(text) {
        statusEl.textContent = text;
      }

      async function api(action, method, body) {
        const url = `/api/review?review=${encodeURIComponent(
          reviewId,
        )}&action=${action}`;
        const response = await fetch(url, {
          method,
          headers: body ? { "content-type": "application/json" } : undefined,
          body: body ? JSON.stringify(body) : undefined,
        });
        if (!response.ok) {
          throw new Error((await response.text()) || `Request failed`);
        }
        return response.json();
      }

      function currentMarkdown() {
        return joinFrontMatter(
          frontMatterText,
          editor.storage.markdown.getMarkdown(),
        );
      }

      function scheduleSave() {
        if (saveTimer) clearTimeout(saveTimer);
        setStatus("Editing…");
        saveTimer = setTimeout(async () => {
          try {
            const markdown = currentMarkdown();
            await api("save", "POST", { markdown });
            const derived = deriveMarkdownTitle(markdown);
            if (derived) titleEl.textContent = derived;
            setStatus("Saved");
          } catch (error) {
            setStatus(`Save failed: ${error.message}`);
          }
        }, 700);
      }

      function setFmError(message) {
        if (!message) {
          fmError.hidden = true;
          fmError.textContent = "";
          return;
        }
        fmError.hidden = false;
        fmError.textContent = message;
      }

      function readFieldsIntoMatter() {
        const data = {};
        let emptyKeys = 0;
        for (const row of fmFields.querySelectorAll(".fm-row")) {
          const key = row.querySelector(".key").value.trim();
          const valueRaw = row.querySelector(".value").value;
          if (!key) {
            emptyKeys += 1;
            continue;
          }
          data[key] = parseFrontMatterFieldValue(valueRaw);
        }
        if (Object.keys(data).length === 0 && emptyKeys > 0) {
          return "";
        }
        return serializeFrontMatterData(data);
      }

      function syncMatterFromUi() {
        if (frontMatterText === null) return;
        if (frontMatterMode === "raw") {
          frontMatterText = fmRaw.value;
          const parsed = parseFrontMatterData(frontMatterText);
          setFmError(
            parsed || frontMatterText.trim().length === 0
              ? null
              : "YAML could not be parsed; it will still be saved as written.",
          );
          return;
        }
        try {
          frontMatterText = readFieldsIntoMatter();
          setFmError(null);
        } catch (error) {
          setFmError(error.message || "Could not serialize front matter.");
        }
      }

      function renderFieldRows(data) {
        fmFields.innerHTML = "";
        const entries = Object.entries(data);
        if (entries.length === 0) {
          addFieldRow("", "");
          return;
        }
        for (const [key, value] of entries) {
          addFieldRow(key, formatFrontMatterFieldValue(value));
        }
      }

      function addFieldRow(key, value) {
        const row = document.createElement("div");
        row.className = "fm-row";
        const keyInput = document.createElement("input");
        keyInput.className = "key";
        keyInput.type = "text";
        keyInput.placeholder = "key";
        keyInput.spellcheck = false;
        keyInput.value = key;
        const valueInput = document.createElement("textarea");
        valueInput.className = "value";
        valueInput.rows = 1;
        valueInput.placeholder = "value";
        valueInput.spellcheck = false;
        valueInput.value = value;
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "fm-remove-field";
        remove.title = "Remove field";
        remove.textContent = "×";
        remove.addEventListener("click", () => {
          row.remove();
          if (fmFields.children.length === 0) addFieldRow("", "");
          onFrontMatterEdit();
        });
        const onEdit = () => onFrontMatterEdit();
        keyInput.addEventListener("input", onEdit);
        valueInput.addEventListener("input", onEdit);
        row.append(keyInput, valueInput, remove);
        fmFields.append(row);
      }

      function showFrontMatterUi(hasMatter) {
        fmRoot.hidden = !hasMatter;
        fmAddWrap.hidden = hasMatter;
      }

      function setFrontMatterMode(mode) {
        frontMatterMode = mode;
        const raw = mode === "raw";
        fmRaw.hidden = !raw;
        fmFields.hidden = raw;
        fmAddFieldRow.hidden = raw;
        fmModeToggle.textContent = raw ? "Edit fields" : "Edit as YAML";
      }

      function loadFrontMatter(matter) {
        frontMatterText = matter;
        if (matter === null) {
          showFrontMatterUi(false);
          setFmError(null);
          fmRaw.value = "";
          fmFields.innerHTML = "";
          return;
        }
        showFrontMatterUi(true);
        fmRaw.value = matter;
        const data = parseFrontMatterData(matter);
        if (data) {
          setFrontMatterMode("fields");
          renderFieldRows(data);
          setFmError(null);
        } else {
          setFrontMatterMode("raw");
          setFmError(
            matter.trim().length === 0
              ? null
              : "YAML could not be parsed; edit as YAML or fix the syntax.",
          );
        }
      }

      function onFrontMatterEdit() {
        if (applyingRemote) return;
        syncMatterFromUi();
        scheduleSave();
      }

      document.getElementById("fm-add").addEventListener("click", () => {
        frontMatterText = "title: ";
        showFrontMatterUi(true);
        setFrontMatterMode("fields");
        renderFieldRows({ title: "" });
        setFmError(null);
        const keyInput = fmFields.querySelector(".key");
        keyInput?.focus();
        scheduleSave();
      });

      document.getElementById("fm-clear").addEventListener("click", () => {
        frontMatterText = null;
        showFrontMatterUi(false);
        setFmError(null);
        fmRaw.value = "";
        fmFields.innerHTML = "";
        scheduleSave();
      });

      document.getElementById("fm-add-field").addEventListener("click", () => {
        addFieldRow("", "");
        const rows = fmFields.querySelectorAll(".key");
        rows[rows.length - 1]?.focus();
      });

      fmModeToggle.addEventListener("click", () => {
        if (frontMatterMode === "fields") {
          syncMatterFromUi();
          fmRaw.value = frontMatterText ?? "";
          setFrontMatterMode("raw");
        } else {
          const data = parseFrontMatterData(fmRaw.value);
          if (!data && fmRaw.value.trim().length > 0) {
            setFmError("Fix the YAML before switching to field editing.");
            return;
          }
          frontMatterText = fmRaw.value;
          setFrontMatterMode("fields");
          renderFieldRows(data ?? { title: "" });
          setFmError(null);
        }
      });

      fmRaw.addEventListener("input", onFrontMatterEdit);

      const editor = new Editor({
        element: document.getElementById("editor"),
        extensions: [
          StarterKit,
          Markdown.configure({ html: false, linkify: true }),
        ],
        content: "",
        onUpdate: () => {
          if (!applyingRemote) scheduleSave();
          hideBubble();
          hidePopover();
        },
        onSelectionUpdate: () => {
          hidePopover();
          const { from, to, empty } = editor.state.selection;
          if (empty) {
            hideBubble();
            return;
          }
          showBubbleAt(from, to);
        },
      });

      function setDocMarkdown(text) {
        applyingRemote = true;
        const { matter, body } = splitFrontMatter(text);
        loadFrontMatter(matter);
        editor.commands.setContent(body, false);
        applyingRemote = false;
      }

      // Pending suggestions rendered as inline tracked changes. The anchor
      // search only handles quotes inside a single text block; anything the
      // search can't place still shows as a sidebar card.
      let inlineSuggestions = [];

      function findQuote(doc, quote) {
        if (!quote || quote.includes("\n")) return null;
        let result = null;
        doc.descendants((node, pos) => {
          if (result) return false;
          if (!node.isTextblock) return true;
          const index = node.textContent.indexOf(quote);
          if (index !== -1) {
            result = {
              from: pos + 1 + index,
              to: pos + 1 + index + quote.length,
            };
          }
          return false;
        });
        return result;
      }

      function suggestWidget(s) {
        const span = document.createElement("span");
        span.className = "suggest-widget";
        span.contentEditable = "false";
        const ins = document.createElement("span");
        ins.className = "suggest-ins";
        ins.textContent = s.replacement;
        const accept = document.createElement("button");
        accept.textContent = "✓";
        accept.title = s.note ? `Accept: ${s.note}` : "Accept this suggestion";
        accept.onmousedown = (event) => event.preventDefault();
        accept.onclick = () => decide(s.id, "accepted");
        const reject = document.createElement("button");
        reject.textContent = "✕";
        reject.title = "Reject this suggestion";
        reject.onmousedown = (event) => event.preventDefault();
        reject.onclick = () => decide(s.id, "rejected");
        span.append(ins, accept, reject);
        return span;
      }

      editor.registerPlugin(
        new Plugin({
          key: new PluginKey("inline-suggestions"),
          props: {
            decorations(state) {
              if (inlineSuggestions.length === 0) return DecorationSet.empty;
              const decorations = [];
              for (const s of inlineSuggestions) {
                const found = findQuote(state.doc, s.anchorQuote);
                if (!found) continue;
                decorations.push(
                  Decoration.inline(found.from, found.to, {
                    class: "suggest-del",
                  }),
                  Decoration.widget(found.to, () => suggestWidget(s), {
                    side: 1,
                  }),
                );
              }
              return DecorationSet.create(state.doc, decorations);
            },
          },
        }),
      );

      const bubble = document.getElementById("comment-bubble");
      const popover = document.getElementById("comment-popover");
      const popoverInput = document.getElementById("popover-input");
      // The selection the popover is commenting on, captured when the bubble
      // is clicked so focusing the textarea can't lose it.
      let pendingAnchor = null;

      function selectionCoords(pos) {
        const coords = editor.view.coordsAtPos(pos);
        const left = Math.min(coords.left, window.innerWidth - 300);
        return { top: coords.bottom + 8, left: Math.max(left, 8) };
      }

      function showBubbleAt(from, to) {
        const { top, left } = selectionCoords(to);
        bubble.style.top = `${top}px`;
        bubble.style.left = `${left}px`;
        bubble.style.display = "block";
      }

      function hideBubble() {
        bubble.style.display = "none";
      }

      function hidePopover() {
        popover.style.display = "none";
        pendingAnchor = null;
      }

      bubble.addEventListener("mousedown", (event) => {
        // Keep the editor selection: don't let the button steal focus first.
        event.preventDefault();
        const { from, to } = editor.state.selection;
        // The rendered document's plain text, not markdown source: close
        // enough for the agent to locate the span, so anchor offsets stay
        // null rather than pointing at the wrong markdown position.
        const quote = editor.state.doc.textBetween(from, to, "\n\n");
        if (!quote) return;
        pendingAnchor = { quote };
        const { top, left } = selectionCoords(to);
        popover.style.top = `${top}px`;
        popover.style.left = `${left}px`;
        popover.style.display = "block";
        hideBubble();
        popoverInput.value = "";
        popoverInput.focus();
      });

      document
        .getElementById("popover-cancel")
        .addEventListener("click", hidePopover);
      popoverInput.addEventListener("keydown", (event) => {
        if (event.key === "Escape") hidePopover();
        if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
          submitComment();
        }
      });
      document
        .getElementById("popover-submit")
        .addEventListener("click", submitComment);

      async function submitComment() {
        if (!pendingAnchor) return;
        const bodyText = popoverInput.value.trim();
        if (!bodyText) {
          popoverInput.focus();
          return;
        }
        try {
          await api("comment", "POST", {
            anchorQuote: pendingAnchor.quote,
            body: bodyText,
          });
          hidePopover();
          await refresh();
          setStatus("Comment added");
        } catch (error) {
          setStatus(`Comment failed: ${error.message}`);
        }
      }

      function suggestionCard(s) {
        const card = document.createElement("div");
        card.className = "card agent";
        card.innerHTML = `
          <div class="meta">Suggestion${s.note ? " · " + escapeHtml(s.note) : ""}</div>
          <div class="quote">${escapeHtml(s.anchorQuote)}</div>
          <div class="replacement">${escapeHtml(s.replacement)}</div>
        `;
        const row = document.createElement("div");
        row.className = "row";
        const accept = document.createElement("button");
        accept.className = "primary";
        accept.textContent = "Accept";
        accept.onclick = () => decide(s.id, "accepted");
        const reject = document.createElement("button");
        reject.textContent = "Reject";
        reject.onclick = () => decide(s.id, "rejected");
        row.append(accept, reject);
        card.append(row);
        return card;
      }

      async function decide(suggestionId, decision) {
        try {
          const result = await api("decide", "POST", {
            suggestionId,
            decision,
          });
          if (decision === "accepted") {
            if (result.applied) {
              setDocMarkdown(result.markdown);
              setStatus(
                result.occurrenceCount > 1
                  ? `Suggestion applied (the quoted text matched ${result.occurrenceCount} places; used the agent's anchor)`
                  : "Suggestion applied",
              );
            } else {
              setStatus(
                "The anchored text has changed, so the suggestion is still pending — restore the text or reject it.",
              );
            }
          } else {
            setStatus("Suggestion rejected");
          }
          await refresh();
        } catch (error) {
          setStatus(`Decision failed: ${error.message}`);
        }
      }

      function commentCard(c) {
        const card = document.createElement("div");
        card.className = c.origin === "agent" ? "card agent" : "card";
        const who = c.origin === "agent" ? "Agent" : c.author || "Reviewer";
        card.innerHTML = `
          <div class="meta">${escapeHtml(who)}${
            c.status === "resolved" ? " · resolved" : ""
          }</div>
          ${c.anchorQuote ? `<div class="quote">${escapeHtml(c.anchorQuote)}</div>` : ""}
          <div>${escapeHtml(c.body)}</div>
        `;
        if (c.origin === "reviewer" && c.status === "open") {
          const row = document.createElement("div");
          row.className = "row";
          const resolve = document.createElement("button");
          resolve.textContent = "Resolve";
          resolve.onclick = async () => {
            await api("resolve-comment", "POST", { commentId: c.id });
            await refresh();
          };
          row.append(resolve);
          card.append(row);
        }
        return card;
      }

      async function refresh() {
        const state = await api("state", "GET");
        titleEl.textContent = state.title || "Living Doc";
        inlineSuggestions = state.pendingSuggestions;
        // Repaint decorations against the current document.
        editor.view.dispatch(editor.state.tr);
        const suggestions = document.getElementById("suggestions");
        suggestions.innerHTML = "";
        if (state.pendingSuggestions.length === 0) {
          suggestions.innerHTML =
            '<div class="empty">No pending suggestions.</div>';
        } else {
          state.pendingSuggestions.forEach((s) =>
            suggestions.append(suggestionCard(s)),
          );
        }
        const comments = document.getElementById("comments");
        comments.innerHTML = "";
        if (state.comments.length === 0) {
          comments.innerHTML = '<div class="empty">No comments yet.</div>';
        } else {
          state.comments.forEach((c) => comments.append(commentCard(c)));
        }
        return state;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      (async () => {
        try {
          const state = await refresh();
          setDocMarkdown(state.markdown);
          setStatus(`Version ${state.versionNumber} · ready`);
        } catch (error) {
          setStatus(`Could not load: ${error.message}`);
        }
      })();
    </script>
  </body>
</html>
