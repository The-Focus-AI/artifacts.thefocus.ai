[tools]
node = "22"
"npm:pnpm" = "latest"
fnox = "latest"
gh = "latest"
ripgrep = "latest"
fd = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:markdownlint-cli2" = "latest"
"npm:@ai-hero/sandcastle" = "latest"

[env]
_.file = ".fnox/env"

[tasks.setup]
description = "Get this checkout ready: a working 1Password token, then a secrets check"
run = '''
set -eu
OP_ACCOUNT_HOST="thefocusai.1password.com"
OP_VAULT="lubz73mphce5snifu2j26rfkpu"
OP_TOKEN_ITEM="artifacts service account token"

token_reads_vault() {
  [ -n "${OP_SERVICE_ACCOUNT_TOKEN:-}" ] && op vault get "$OP_VAULT" >/dev/null 2>&1
}

if token_reads_vault; then
  echo "✓ The service account token can read the project vault."
else
  echo "No working token here; fetching it with your own 1Password sign-in..."
  TOKEN="$(env -u OP_SERVICE_ACCOUNT_TOKEN op read "op://$OP_VAULT/$OP_TOKEN_ITEM/credential" --account "$OP_ACCOUNT_HOST" --no-newline 2>/dev/null || true)"
  if [ -z "$TOKEN" ]; then
    echo "Could not get the project token." >&2
    echo "  Cloud workspace: set OP_SERVICE_ACCOUNT_TOKEN in the project's cloud secret settings to the value of '$OP_TOKEN_ITEM', then restart the workspace." >&2
    echo "  Your own machine: sign in to $OP_ACCOUNT_HOST in the 1Password app, turn on its command-line integration, and ask an owner to add you to this project's group." >&2
    exit 1
  fi
  git check-ignore -q -- .fnox/env || { echo "STOP: .fnox/env is not ignored by git; not writing a token." >&2; exit 1; }
  if [ -n "$(git ls-files -- .fnox/env)" ]; then
    echo "STOP: .fnox/env is tracked by git; not writing a token." >&2
    exit 1
  fi
  umask 077
  mkdir -p .fnox
  chmod 700 .fnox
  printf 'OP_SERVICE_ACCOUNT_TOKEN=%s\n' "$TOKEN" > .fnox/env
  chmod 600 .fnox/env
  export OP_SERVICE_ACCOUNT_TOKEN="$TOKEN"
  token_reads_vault || { echo "The fetched token cannot read the project vault; tell the project owner." >&2; exit 1; }
  echo "✓ Token saved to .fnox/env (ignored by git)."
fi
mise run secrets:check
'''

[tasks.install]
description = "Install project dependencies, pi packages, and locked agent skills"
run = '''
set -euo pipefail
if [ -f package.json ]; then
  pnpm install --frozen-lockfile || pnpm install
  mkdir -p node_modules/.bin
  cat > node_modules/.bin/artifacts <<'SH'
#!/usr/bin/env sh
exec pnpm exec tsx src/cli.ts "$@"
SH
  chmod +x node_modules/.bin/artifacts
fi
npx skills experimental_install
'''

[tasks.dev]
description = "Run development checks"
run = '''
set -euo pipefail
mise run lint
mise run test
'''

[tasks.lint]
description = "Run linters"
run = '''
set -euo pipefail
if [ -f package.json ] && pnpm run | grep -q "^[[:space:]]*lint"; then
  pnpm run lint
elif command -v markdownlint-cli2 >/dev/null 2>&1; then
  markdownlint-cli2 "**/*.md" "#node_modules" "#.pi" "#.agents" || true
else
  echo "No linter configured yet"
fi
if [ -f fnox.toml ]; then
  fnox check
fi
'''

[tasks.test]
description = "Run tests/typechecks"
run = '''
set -euo pipefail
if [ -f package.json ] && pnpm run | grep -q "^[[:space:]]*test"; then
  pnpm run test
else
  echo "No test command configured yet"
fi
'''

[tasks.deploy]
description = "Build or deploy the project"
run = '''
set -euo pipefail
if [ -f package.json ] && pnpm run | grep -q "^[[:space:]]*build"; then
  pnpm run build
else
  echo "No deploy/build command configured yet"
fi
'''

[tasks.publish]
description = "Lint, test, build, and publish to npm"
run = '''
set -euo pipefail
pnpm run lint
pnpm run test
pnpm run build
npm publish --access public "${@}"
'''

[tasks."secrets:check"]
description = "Verify declared secrets resolve"
run = "fnox check"

[tasks."secrets:list"]
description = "List declared secrets"
run = "fnox list"
