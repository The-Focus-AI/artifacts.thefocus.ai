[tools]
node = "22"
"npm:pnpm" = "latest"
fnox = "latest"
gh = "latest"
ripgrep = "latest"
fd = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:markdownlint-cli2" = "latest"
"npm:@ai-hero/sandcastle" = "latest"

[env]
_.file = ".fnox/env"

[tasks.setup]
description = "First-time onboarding: pulls the fnox 1Password service account token into .fnox/env"
run = '''
set -euo pipefail
mkdir -p .fnox
chmod 700 .fnox
if [ -f .fnox/env ] && grep -q '^OP_SERVICE_ACCOUNT_TOKEN=' .fnox/env; then
  echo "✓ .fnox/env already has OP_SERVICE_ACCOUNT_TOKEN — skipping"
  exit 0
fi
TOKEN="$(op read 'op://thefocus/artifacts.thefocus.ai service account token/credential')"
printf 'OP_SERVICE_ACCOUNT_TOKEN=%s\n' "$TOKEN" > .fnox/env
chmod 600 .fnox/env
echo "✓ .fnox/env written. Open a new shell tab or run 'mise exec -- fnox check'."
'''

[tasks.install]
description = "Install project dependencies, pi packages, and locked agent skills"
run = '''
set -euo pipefail
if [ -f package.json ]; then
  pnpm install --frozen-lockfile || pnpm install
fi
npx skills experimental_install
'''

[tasks.dev]
description = "Run development checks"
run = '''
set -euo pipefail
mise run lint
mise run test
'''

[tasks.lint]
description = "Run linters"
run = '''
set -euo pipefail
if [ -f package.json ] && pnpm run | grep -q "^[[:space:]]*lint"; then
  pnpm run lint
elif command -v markdownlint-cli2 >/dev/null 2>&1; then
  markdownlint-cli2 "**/*.md" "#node_modules" "#.pi" "#.agents" || true
else
  echo "No linter configured yet"
fi
if [ -f fnox.toml ]; then
  fnox check
fi
'''

[tasks.test]
description = "Run tests/typechecks"
run = '''
set -euo pipefail
if [ -f package.json ] && pnpm run | grep -q "^[[:space:]]*test"; then
  pnpm run test
else
  echo "No test command configured yet"
fi
'''

[tasks.deploy]
description = "Build or deploy the project"
run = '''
set -euo pipefail
if [ -f package.json ] && pnpm run | grep -q "^[[:space:]]*build"; then
  pnpm run build
else
  echo "No deploy/build command configured yet"
fi
'''

[tasks.publish]
description = "Lint, test, build, and publish to npm"
run = '''
set -euo pipefail
pnpm run lint
pnpm run test
pnpm run build
npm publish --access public
'''

[tasks."secrets:check"]
description = "Verify declared secrets resolve"
run = "fnox check"

[tasks."secrets:list"]
description = "List declared secrets"
run = "fnox list"
